<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONDA — Code PIN Requis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card bg-secondary text-white p-4 shadow-lg text-center" style="max-width: 380px; width: 100%;">
    <div class="mb-3">
        <span class="fs-1">🔒</span>
        <h4 class="mt-2">ONDA Security</h4>
        <p class="small text-warning">Entrez le code PIN pour l'équipement #{{ equipment.pk }}</p>
    </div>

    {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input type="password" name="pin" maxlength="4" class="form-control form-control-lg text-center font-monospace" placeholder="••••" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">Déverrouiller</button>
    </form>
</div>

</body>
</html>
