<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ONDA - Gestion du Parc Informatique{% endblock %}</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* En-tête bleu marine */
        .header-top-onda {
            background-color: #112340;
            padding: 10px 24px;
        }

        /* Boîte contenant le logo */
        .logo-box-onda {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 3px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        /* Ligne de séparation orange */
        .orange-divider-onda {
            height: 3px;
            background-color: #e58e00;
        }

        /* Barre de navigation sombre */
        .navbar-sub-onda {
            background-color: #071222;
            padding: 6px 24px;
        }

        /* Liens de navigation */
        .nav-link-item {
            color: #8c9cb8;
            text-decoration: none;
            font-size: 0.92rem;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease-in-out;
        }

        .nav-link-item:hover {
            color: #ffffff;
        }

        /* Onglet actif avec fond sombre */
        .nav-link-item.active {
            background-color: #1b2e4b;
            color: #ffffff;
            font-weight: 600;
        }

        /* Badge Système En Ligne */
        .status-pill {
            border: 1px solid #2e4368;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-radius: 20px;
            padding: 5px 16px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .badge-arabe {
            background-color: #e58e00;
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- En-tête Supérieur -->
    <header class="header-top-onda text-white">
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            
            <!-- Logo & Titre principal -->
            <div class="d-flex align-items-center gap-3">
                <!-- Nouveau Logo Officiel ONDA / Airports of Morocco -->
                <div class="logo-box-onda">
                    <svg viewBox="0 0 100 100" width="38" height="38" xmlns="http://www.w3.org/2000/svg">
                        <!-- Arrière-plan cyan / bleu clair -->
                        <rect width="100" height="100" fill="#7ed0ee" rx="8"/>
                        <!-- Carré bleu marine / noir géométrique -->
                        <polygon points="50,12 88,50 50,88 12,50" fill="#0a1a36"/>
                        <!-- Rectangle orange / ambre intérieur -->
                        <polygon points="50,25 75,50 50,75 25,50" fill="#f39c12"/>
                        <!-- Carré central blanc -->
                        <rect x="37" y="37" width="26" height="26" fill="#ffffff"/>
                        <!-- Triangles cyan d'angle -->
                        <polygon points="0,0 50,0 0,50" fill="#7ed0ee"/>
                        <polygon points="100,0 50,0 100,50" fill="#7ed0ee"/>
                        <polygon points="0,100 50,100 0,50" fill="#7ed0ee"/>
                        <polygon points="100,100 50,100 100,50" fill="#7ed0ee"/>
                    </svg>
                </div>
                <div>
                    <div class="d-flex align-items-center gap-2">
                        <h5 class="mb-0 fw-bold text-white fs-5">ONDA</h5>
                        <span class="badge-arabe">مطارات المغرب</span>
                    </div>
                    <div class="text-white-50" style="font-size: 0.82rem; color: #a4b6d4 !important;">
                        Office National Des Aéroports — Aéroport Nador El Aroui
                    </div>
                </div>
            </div>

            <!-- Indicateur d'état -->
            <div>
                <span class="status-pill">
                    <span class="bg-success rounded-circle d-inline-block" style="width: 9px; height: 9px;"></span>
                    <span>Système En Ligne</span>
                </span>
            </div>

        </div>
    </header>

    <!-- Bandeau Séparateur Orange -->
    <div class="orange-divider-onda"></div>

    <!-- Navigation -->
    <nav class="navbar-sub-onda">
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'equipment_list' %}" class="nav-link-item {% if request.resolver_match.url_name == 'equipment_list' %}active{% endif %}">
                    <i class="bi bi-boxes"></i> Inventaire
                </a>
                <a href="{% url 'security_dashboard' %}" class="nav-link-item {% if request.resolver_match.url_name == 'security_dashboard' %}active{% endif %}">
                    <i class="bi bi-shield-check"></i> Dashboard Sécurité
                </a>
                <a href="{% url 'export_equipment_csv' %}" class="nav-link-item">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exporter CSV
                </a>
            </div>
            <div>
                <a href="/admin/" class="btn btn-sm btn-outline-light rounded-2 px-3 py-1" style="font-size: 0.85rem;">
                    <i class="bi bi-gear-fill me-1"></i> Administration
                </a>
            </div>
        </div>
    </nav>

    <!-- Zone de Contenu -->
    <main class="container-fluid px-4 py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Pied de Page -->
    <footer class="py-3 text-center text-white-50 small" style="background-color: #071222;">
        © 2026 ONDA - Office National Des Aéroports. Tous droits réservés.
    </footer>

</body>
</html>
